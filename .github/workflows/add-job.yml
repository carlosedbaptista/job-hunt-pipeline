name: Add Job (manual)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Job URL (optional if you paste the description; LinkedIn/Indeed may block scraping)"
        required: false
        type: string
      title:
        description: "Job title"
        required: false
        type: string
      company:
        description: "Company"
        required: false
        type: string
      location:
        description: "Location"
        required: false
        type: string
      text:
        description: "Full job description text (most reliable — paste it here)"
        required: false
        type: string

# Same group as the daily scheduler: all three workflows push to main
# and tracker/jobs.db is a binary SQLite file that cannot be merged.
concurrency:
  group: job-hunt-repo-write
  cancel-in-progress: false

jobs:
  add-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pinned SHA)
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore candidate profile from secrets
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
          CANDIDATE_PHOTO_B64: ${{ secrets.CANDIDATE_PHOTO_B64 }}
        run: |
          mkdir -p config
          if [ -z "$CANDIDATE_PROFILE_B64" ]; then
            echo "CANDIDATE_PROFILE_B64 not configured -- evaluator uses PII-free fallback"
          elif ! printf '%s' "$CANDIDATE_PROFILE_B64" | tr -d ' \t\r\n' | base64 -d > config/candidate_profile.json 2>/dev/null \
            || ! python -c "import json; json.load(open('config/candidate_profile.json', encoding='utf-8'))" 2>/dev/null; then
            echo "::warning::CANDIDATE_PROFILE_B64 is not valid base64/UTF-8 JSON -- using PII-free fallback"
            rm -f config/candidate_profile.json
          else
            echo "Restored config/candidate_profile.json"
          fi
          if [ -n "$CANDIDATE_PHOTO_B64" ]; then
            printf '%s' "$CANDIDATE_PHOTO_B64" | tr -d ' \t\r\n' | base64 -d > config/photo.jpg 2>/dev/null \
              && echo "Restored config/photo.jpg" \
              || { echo "::warning::CANDIDATE_PHOTO_B64 is not valid base64 -- CV generated without a photo"; rm -f config/photo.jpg; }
          fi

      - name: Evaluate job (generates CV/CL too, if the match is >= APPLY)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          GDRIVE_REFRESH_TOKEN_B64: ${{ secrets.GDRIVE_REFRESH_TOKEN_B64 }}
          GDRIVE_CREDENTIALS_JSON_B64: ${{ secrets.GDRIVE_CREDENTIALS_JSON_B64 }}
          # Without these the generated CV/CL are mailed nowhere and die with
          # the runner: generated_docs/ is gitignored, there is no artifact
          # upload (public repo), and Drive has never worked.
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          JOB_URL: ${{ inputs.url }}
          JOB_TITLE: ${{ inputs.title }}
          JOB_COMPANY: ${{ inputs.company }}
          JOB_LOCATION: ${{ inputs.location }}
          JOB_TEXT: ${{ inputs.text }}
        run: |
          if [ -n "$JOB_TEXT" ]; then
            printf '%s' "$JOB_TEXT" > /tmp/job_input.txt
            python agents/add_job.py --file /tmp/job_input.txt --title "$JOB_TITLE" --company "$JOB_COMPANY" --location "$JOB_LOCATION" ${JOB_URL:+--url "$JOB_URL"}
          elif [ -n "$JOB_URL" ]; then
            python agents/add_job.py --url "$JOB_URL" --title "$JOB_TITLE" --company "$JOB_COMPANY" --location "$JOB_LOCATION"
          else
            echo "Provide at least the job URL or the description text."
            exit 1
          fi

      # No generated_docs/ artifact: this repo is PUBLIC and Actions
      # artifacts are downloadable by any authenticated GitHub user, so
      # this published the candidate's name, phone, e-mail, permit and
      # photo. generated_docs/ is gitignored for the same reason.
      #
      # The durable copy is the e-mail: doc_generator attaches the CV/CL and
      # mails them to GMAIL_RECIPIENT (the candidate, never a recruiter).
      # Google Drive is a second copy that has never actually worked -- the
      # Service Account answers 403 "storage quota" on every upload.

      - name: Regenerate dashboard
        env:
          DB_PATH: ./tracker/jobs.db
        run: python src/dashboard.py
        continue-on-error: true

      - name: Commit result
        env:
          # Passed via env, never interpolated into the script: inline
          # ${{ inputs.* }} in run blocks is a shell injection vector.
          JOB_TITLE: ${{ inputs.title }}
          JOB_COMPANY: ${{ inputs.company }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add digests/manual_evaluations.json digests/dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: manual job evaluation [$JOB_TITLE @ $JOB_COMPANY]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) -- rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
