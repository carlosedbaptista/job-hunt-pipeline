name: Job Hunt Daily Pipeline

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 CEST
    - cron: '0 12 * * *'  # 12:00 UTC = 14:00 CEST
  workflow_dispatch:

# A manual run overlapping the cron run would race on git push
concurrency:
  group: job-hunt-pipeline
  cancel-in-progress: false

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pinned SHA)
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore candidate profile from secrets
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
          CANDIDATE_PHOTO_B64: ${{ secrets.CANDIDATE_PHOTO_B64 }}
          CV_MODEL_B64: ${{ secrets.CV_MODEL_B64 }}
          CL_MODEL_B64: ${{ secrets.CL_MODEL_B64 }}
        run: |
          mkdir -p config
          if [ -n "$CANDIDATE_PROFILE_B64" ]; then
            echo "$CANDIDATE_PROFILE_B64" | base64 -d > config/candidate_profile.json
          else
            echo "CANDIDATE_PROFILE_B64 not configured -- using fallback without PII"
          fi
          if [ -n "$CANDIDATE_PHOTO_B64" ]; then
            echo "$CANDIDATE_PHOTO_B64" | base64 -d > config/photo.jpg
          fi
          if [ -n "$CV_MODEL_B64" ]; then
            echo "$CV_MODEL_B64" | base64 -d > config/cv_model.txt
          fi
          if [ -n "$CL_MODEL_B64" ]; then
            echo "$CL_MODEL_B64" | base64 -d > config/cover_letter_model.txt
          fi

      - name: Fetch Adzuna jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_MAX_HITS: "35"
        run: python agents/adzuna_ingestor.py

      # LinkedIn ingestion disabled -- consistently returns 0 jobs
      # - name: Fetch LinkedIn jobs
      #   run: python agents/linkedin_ingestor.py
      #   continue-on-error: true

      - name: Fetch Gmail alerts
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: python src/email_ingestor.py
        continue-on-error: true

      - name: Parse job emails (local, no API)
        run: python agents/email_parser_local.py

      - name: Unify job sources
        run: python src/unified_ingestor.py

      - name: Evaluate job fit with AI
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
        run: python agents/job_evaluator.py

      - name: Generate daily digest
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
        run: python src/week4_pipeline.py --digest-only

      - name: Generate dashboard
        env:
          DB_PATH: ./tracker/jobs.db
        run: python src/dashboard.py

      - name: Generate tailored CVs/CLs
        if: always()
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          HIGH_SCORE_THRESHOLD: "85"
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          GDRIVE_REFRESH_TOKEN_B64: ${{ secrets.GDRIVE_REFRESH_TOKEN_B64 }}
          GDRIVE_CREDENTIALS_JSON_B64: ${{ secrets.GDRIVE_CREDENTIALS_JSON_B64 }}
        run: python agents/doc_generator.py
        continue-on-error: true

      - name: High-Score Alerts
        run: python agents/high_score_alert.py
        continue-on-error: true

      - name: Send email notification
        if: always()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python agents/email_notifier.py

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/raw_jobs/ data/history/ digests/ tracker/jobs.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          JOB_COUNT=$(python -c "import json; d=json.load(open('digests/digest_latest.json')); print(d.get('total_evaluated', 0))" 2>/dev/null || echo 0)
          APPLY_COUNT=$(python -c "import json; d=json.load(open('digests/digest_latest.json')); jobs=d.get('top_jobs',[]); print(sum(1 for j in jobs if (j.get('score') or 0)>=80))" 2>/dev/null || echo 0)
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "chore: daily digest [$TIMESTAMP | $JOB_COUNT jobs | $APPLY_COUNT APPLY]"
          git push
