name: Job Hunt Daily Pipeline

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 CEST
    - cron: '0 12 * * *'  # 12:00 UTC = 14:00 CEST
  workflow_dispatch:
    inputs:
      skip_ingestion:
        description: "Test mode: reuse the jobs already fetched, do not call Adzuna or Gmail"
        required: false
        default: false
        type: boolean
      reevaluate:
        description: "Test mode: also re-score jobs already marked as seen"
        required: false
        default: false
        type: boolean
      max_evaluations:
        description: "Cap LLM calls for this run (blank = the usual 30). Use 3-5 when testing."
        required: false
        default: ""
        type: string

# A manual run overlapping the cron run would race on git push
# Shared by every workflow that pushes to main (add-job, track-application).
# tracker/jobs.db is a binary SQLite file: two concurrent writers cannot be
# merged, so they must be serialized rather than reconciled.
concurrency:
  group: job-hunt-repo-write
  cancel-in-progress: false

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pinned SHA)
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore candidate profile from secrets
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
          CANDIDATE_PHOTO_B64: ${{ secrets.CANDIDATE_PHOTO_B64 }}
          CV_MODEL_B64: ${{ secrets.CV_MODEL_B64 }}
          CL_MODEL_B64: ${{ secrets.CL_MODEL_B64 }}
          OUTCOME_NOTES_B64: ${{ secrets.OUTCOME_NOTES_B64 }}
        run: |
          # Tolerant restore: strips whitespace/CR before decoding, validates
          # the result (UTF-8/JSON), and degrades with a warning instead of
          # failing the whole run when a secret is malformed.
          restore_b64() {
            local name="$1" dest="$2" kind="${3:-binary}"
            local val="${!name}"
            if [ -z "$val" ]; then
              echo "$name not configured -- skipping $dest"
              return 0
            fi
            if ! printf '%s' "$val" | tr -d ' \t\r\n' | base64 -d > "$dest" 2>/dev/null; then
              echo "::warning::$name is not valid base64 -- $dest not restored. Re-create the secret from the raw file bytes without line wraps."
              rm -f "$dest"
              return 0
            fi
            # The NUL check catches UTF-16 files, whose ASCII portion would
            # otherwise pass plain UTF-8 validation
            if [ "$kind" = "text" ] && ! python -c "b=open('$dest','rb').read(); b.decode('utf-8'); assert b'\x00' not in b" 2>/dev/null; then
              echo "::warning::$name decoded but is not valid UTF-8 text -- $dest removed. Encode the file as UTF-8 before base64."
              rm -f "$dest"
              return 0
            fi
            if [ "$kind" = "json" ] && ! python -c "import json; json.load(open('$dest', encoding='utf-8'))" 2>/dev/null; then
              echo "::warning::$name decoded but is not valid UTF-8 JSON -- $dest removed. Encode the file as UTF-8 before base64."
              rm -f "$dest"
              return 0
            fi
            echo "Restored $dest"
          }
          mkdir -p config
          restore_b64 CANDIDATE_PROFILE_B64 config/candidate_profile.json json
          restore_b64 CANDIDATE_PHOTO_B64 config/photo.jpg binary
          restore_b64 CV_MODEL_B64 config/cv_model.txt text
          restore_b64 CL_MODEL_B64 config/cover_letter_model.txt text
          restore_b64 OUTCOME_NOTES_B64 tracker/outcome_notes.json json

      - name: Verify the restored profile
        # Runs BEFORE anything is fetched or scored. The role is injected into
        # every scoring prompt and printed on every generated CV, so a stale
        # profile skews the whole day and sends the wrong title to employers.
        # It failed silently once: the title changed, the base64 secret was
        # regenerated from a stale file, and nothing complained.
        # No continue-on-error: this is meant to stop the run.
        run: python agents/check_profile.py

      - name: Fetch Adzuna jobs
        if: inputs.skip_ingestion != true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_MAX_HITS: "35"
        # Degrades like the Gmail step: a transient Adzuna 5xx used to abort
        # the run before the e-mail-sourced jobs were parsed at all.
        run: python agents/adzuna_ingestor.py
        continue-on-error: true

      - name: Fetch Gmail alerts
        if: inputs.skip_ingestion != true
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: python src/email_ingestor.py
        continue-on-error: true

      - name: Parse job emails (local, no API)
        if: inputs.skip_ingestion != true
        run: python agents/email_parser_local.py

      - name: Unify job sources
        env:
          # Test mode only: re-score jobs already seen, so the pipeline can be
          # exercised end to end without spending job-board quota.
          REEVALUATE_ALL: ${{ inputs.reevaluate }}
          # The cost cap is applied HERE, not in the evaluator, so lowering it
          # for a test run genuinely reduces the number of LLM calls.
          MAX_EVALUATIONS_PER_RUN: ${{ inputs.max_evaluations }}
        run: python src/unified_ingestor.py

      # E-mail alert cards (LinkedIn/Glassdoor/XING) arrive with a title and
      # no description, so the evaluator scores them blind and the
      # low-confidence cap pins them at REVIEW forever. This step looks the
      # same posting up on Adzuna (already integrated, free quota to spare)
      # and attaches the real text. Non-fatal by construction: no match, no
      # credentials, or any error leaves the jobs exactly as they were.
      - name: Enrich missing job descriptions
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ENRICH_MAX_LOOKUPS: "12"
          # Chasing full postings on employers' ATS boards costs no Adzuna
          # quota (different hosts) -- only runner time. 30 jobs took ~2 min
          # in the 2026-08-23 measurement, and repeated employers are cached.
          RESOLVE_MAX_JOBS: "30"
        run: python agents/description_enricher.py
        continue-on-error: true
        timeout-minutes: 10

      - name: Evaluate job fit with AI
        id: evaluate
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          # Switch models from the GitHub UI (Settings -> Variables)
          # without touching code. Unset means kimi-k2.6.
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          # 'agent' = the tool-using decision agent; 'rules' (or unset) = the
          # deterministic single-call evaluator, byte-for-byte the old path.
          EVALUATION_MODE: 'agent'
        run: python agents/decision_agent.py

      - name: Generate daily digest
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          # Switch models from the GitHub UI (Settings -> Variables)
          # without touching code. Unset means kimi-k2.6.
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
        # Called directly. src/week4_pipeline.py used to wrap this in a
        # subprocess and printed a banner, and its other code path
        # orchestrated a pipeline that no longer exists (JSearch,
        # cover_letter_writer, page_generator). Removed 2026-08-23.
        run: python agents/digest_generator.py

      - name: Generate dashboard
        env:
          DB_PATH: ./tracker/jobs.db
        run: python src/dashboard.py

      # The judgement layer. An LLM orchestrator decides what this run needs:
      # docs for APPLY jobs, high-score alerts, follow-up drafts, and
      # re-scoring of stale REVIEW jobs when budget remains. ORCHESTRATION_MODE
      # 'rules' (or unset) runs the three legacy scripts in the old order
      # instead -- byte-for-byte the pre-orchestrator behavior. If the agent
      # fails, the code falls back to that same legacy chain, so a bad
      # orchestrator day can never skip docs/alerts/follow-ups.
      # Deliberately NOT `if: always()`: on a failed evaluator run the
      # evaluations file is yesterday's, and generating docs from it would
      # spend real Kimi calls on CV/CLs that already exist. The orchestrator
      # double-checks this freshness in code as well.
      #
      # NO artifact upload of generated_docs/. This repo is PUBLIC, and on a
      # public repo Actions artifacts are downloadable by any authenticated
      # GitHub user for the whole retention window. The CVs contain the
      # candidate's full name, phone, personal e-mail, LinkedIn, permit
      # status and photo, plus every company applied to -- exactly the PII
      # the base64-secret restore and .gitignore exist to keep off this repo.
      #
      # The durable copy is the e-mail: doc_generator attaches the CV/CL and
      # mails them to GMAIL_RECIPIENT (the candidate, never a recruiter).
      # Google Drive stays as a second copy but has never worked -- the
      # Service Account answers 403 "Service Accounts do not have storage
      # quota" on every upload, and only OAuth2 (GDRIVE_REFRESH_TOKEN_B64)
      # fixes it. Before the e-mail path existed the PDFs simply died with
      # the runner.
      - name: Orchestrate run (docs, alerts, follow-ups, re-scores)
        id: orchestrate
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          # Switch models from the GitHub UI (Settings -> Variables)
          # without touching code. Unset means kimi-k2.6.
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          GDRIVE_REFRESH_TOKEN_B64: ${{ secrets.GDRIVE_REFRESH_TOKEN_B64 }}
          GDRIVE_CREDENTIALS_JSON_B64: ${{ secrets.GDRIVE_CREDENTIALS_JSON_B64 }}
          HIGH_SCORE_THRESHOLD: "85"
          ORCHESTRATION_MODE: 'agent'
        run: python agents/orchestrator_agent.py
        continue-on-error: true

      - name: Send email notification
        if: always()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python agents/email_notifier.py
        continue-on-error: true

      - name: Commit and push results
        if: always()
        env:
          # unified_ingestor marks jobs as seen in tracker/jobs.db BEFORE the
          # evaluator runs. When the evaluator exits 1 (no Kimi credits, or a
          # missing profile -- both deliberate loud failures), committing that
          # DB would suppress those jobs for the whole 21-day retention: a
          # billing lapse silently destroying three weeks of job discovery.
          # So the DB is committed only when scoring actually happened.
          EVALUATOR_OK: ${{ steps.evaluate.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw_jobs/ data/history/ digests/
          if [ "$EVALUATOR_OK" = "true" ]; then
            git add tracker/jobs.db
          else
            echo "::warning::Evaluator did not succeed -- NOT committing tracker/jobs.db, "\
                 "so the jobs it marked as seen come back on the next run."
            git checkout -- tracker/jobs.db 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          JOB_COUNT=$(python -c "import json; d=json.load(open('digests/digest_latest.json')); print(d.get('total_evaluated', 0))" 2>/dev/null || echo 0)
          APPLY_COUNT=$(python -c "import json; d=json.load(open('digests/digest_latest.json')); jobs=d.get('top_jobs',[]); print(sum(1 for j in jobs if (j.get('score') or 0)>=80))" 2>/dev/null || echo 0)
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "chore: daily digest [$TIMESTAMP | $JOB_COUNT jobs | $APPLY_COUNT APPLY]"
          # A manual Add Job / Track Application run pushing mid-flight used
          # to make this a non-fast-forward: the step failed and the entire
          # run's digest, history, raw jobs and DB were thrown away. Rebase
          # and retry. tracker/jobs.db is binary and cannot be merged, so all
          # three pushing workflows share one concurrency group to make a
          # genuine collision rare; this loop covers the rest.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) -- rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
